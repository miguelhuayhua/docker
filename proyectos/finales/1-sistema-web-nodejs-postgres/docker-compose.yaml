services:
  # Base de datos relacional PostgreSQL (Imagen oficial lista para usar)
  db:
    image: postgres:16-alpine
    container_name: p1_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appsecret123
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend REST API construida en Node.js
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: p1_node_api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://appuser:appsecret123@db:5432/appdb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_net

  # Frontend Web & Reverse Proxy Nginx
  web:
    image: nginx:alpine
    container_name: p1_nginx_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - internal_net

  # Interfaz gráfica web para gestionar PostgreSQL (Adminer listo para usar)
  db-admin:
    image: adminer:latest
    container_name: p1_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - internal_net

volumes:
  pgdata:

networks:
  internal_net:
    driver: bridge
