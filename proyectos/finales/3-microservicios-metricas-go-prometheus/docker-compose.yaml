services:
  # Microservicio compilado en Go (ligero y concurrente)
  go-app:
    build:
      context: ./service-go
      dockerfile: Dockerfile
    container_name: p3_go_microservice
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - monitor_net

  # Sistema de recolección de métricas Prometheus (Imagen oficial lista)
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: p3_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitor_net

  # Dashboard de monitoreo visual Grafana (Imagen oficial lista)
  grafana:
    image: grafana/grafana:10.3.3
    container_name: p3_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitor_net

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitor_net:
    driver: bridge
